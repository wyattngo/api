name: Build and Push FLUX klein trial image

# Manual only: the trial image never builds on a push to main.
on:
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.flux
          platforms: linux/amd64
          push: true
          # Optional: only needed if the model repo is gated. An empty secret is fine.
          secrets: |
            hf_token=${{ secrets.HF_TOKEN }}
          tags: |
            36234138/runpod-cutin-flux:latest
            36234138/runpod-cutin-flux:${{ github.sha }}
          provenance: false
